name: Secret

on :
  workflow_dispatch:

env:
  CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
  env_var: ${{ vars.ENTORNO_VAR }}

jobs:
  testing_secrets:
    name: Testing secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: My first secrets
        run: echo ${{ secrets.MY_SECRET }}
      - name: Check secret
        if: env.CHECK_SECRET == 'true'
        run: echo "The secret has verdadero value"
      - name: My first enviroment variable 
        run: echo ${{ env.env_var }} "usado desde enviroment"
      - name: My first variable 
        run: echo "${{ vars.env_var }} usado desde variables"
