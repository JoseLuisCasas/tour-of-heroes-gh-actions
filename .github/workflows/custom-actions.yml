name: Custom Actions demos

on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Custom Action in the same repository
        id: hello
        uses: ./custom-action
        with:
          who-to-greet: "Jose Link"

      - name: Check the output
        run: echo "The time was ${{ steps.hello.outputs.time }}"

        

      - name: Variable GitHub Repository
        run: echo "El repositorio es ${{ github.repository }}"
      - name: Variable GitHub Action
        run: echo "La acción es ${{ github.action}}"
      - name: Variable GitHub Repository Action
        run: echo "La acción repositorio es ${{ github.action_repository}}"
            